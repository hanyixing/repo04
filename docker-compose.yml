# ============================================================
# newbee-mall 容器编排：一键启动数据库 + 应用
# 敏感参数从同目录 .env 读取（见 .env.example），未设置时回退到演示默认值。
#   启动： docker compose up -d
#   停止： docker compose down
# ============================================================
version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: newbee-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-newbee_mall_db}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动导入表结构与初始数据
      - ./src/main/resources/newbee_mall_schema.sql:/docker-entrypoint-initdb.d/newbee_mall_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - newbee-net

  newbee-mall:
    build:
      context: .
      dockerfile: Dockerfile
    image: newbee-mall:latest
    container_name: newbee-mall-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-newbee_mall_db}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      # Jasypt 解密口令：用于解密配置中的 ENC(...) 支付密钥，未使用加密项时可留空
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:-}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "${SERVER_PORT:-28089}:28089"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/28089' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - newbee-net

volumes:
  mysql-data:

networks:
  newbee-net:
    driver: bridge
