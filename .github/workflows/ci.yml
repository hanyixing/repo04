name: CI

# 推送与 PR 触发：自动验证构建、运行测试、生成覆盖率报告并校验镜像可构建
on:
  push:
    branches: [ master, dev, "claude**" ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build-and-test:
    name: Build & Test (JDK 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build, test and verify (test profile)
        run: mvn -B -Ptest clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

  docker-build:
    name: Validate Docker image build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: newbee-mall:ci
