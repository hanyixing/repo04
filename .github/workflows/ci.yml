# ============================================================
# newbee-mall CI/CD 流水线
# 触发条件：push / PR to main / master
# 步骤：编译 → 测试 → JaCoCo 覆盖率 → Docker 构建
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  JAVA_VERSION: "8"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # MySQL 服务容器（供测试阶段使用）
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: newbee_mall_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Initialize database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p123456 newbee_mall_db \
            < src/main/resources/newbee_mall_schema.sql || true

      - name: Maven verify (compile + test + JaCoCo)
        run: mvn verify -Ptest -B
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: newbee_mall_db
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: "123456"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t newbee-mall:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker image inspect newbee-mall:${{ github.sha }}
          echo "Docker image built successfully: newbee-mall:${{ github.sha }}"
